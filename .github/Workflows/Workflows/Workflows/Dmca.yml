name: Generate DMCA Takedown
on:
  workflow_dispatch:
    inputs:
      infringing_url:
        description: 'URL of infringing content'
        required: true
      original_url:
        description: 'URL of your original'
        required: true
jobs:
  dmca:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          cat > dist/takedown.md << EOF
          # DMCA Takedown Notice
          Date: $(date -u +%Y-%m-%d)
          Copyright Owner: Wayne B. Kimball
          Original: ${{ inputs.original_url }}
          Infringing: ${{ inputs.infringing_url }}
          I have good faith belief this use is not authorized.
          I swear under penalty of perjury I am the owner/authorized agent.
          Signature: /Wayne B. Kimball/
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dmca-takedown
          path: dist/takedown.md
